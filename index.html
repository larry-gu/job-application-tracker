<!DOCTYPE html> <!--tells browser we're using HTML5-->
<html lang="en">
    <head> <!-- Info about the page -->
        <meta charset="UTF-8"> <!-- Set up character encoding to display them correctly -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures proper display on different devices -->

        <title>Job Application Tracker</title>

        <link rel ="stylesheet" href="style.css"> <!-- Connects HTML to CSS fle "style.css"-->
    </head>

    <body> <!-- Contains all visible content -->
        <h1>Job Application Tracker</h1> <!-- Main heading -->

        <p>Track my job applications</p> <!-- Paragraph -->

        <h2>Add Application</h2> <!-- Second level heading for sections -->

        <form id ="application-form"> <!-- Content/fields for the form that will be filled out for each application -->

            <label for="company">Company</label> <!-- "label" = input description -->
            <input type="text" id="company" required> <!-- "input" creates a field for data entry  -->

            <label for="position">Position</label>
            <input type="text" id="position" required>

            <label for="work-type">Work Type</label>
            <select id="work-type"> <!-- "select" = dropdown box -->
                <option value="remote">Remote</option> <!-- "option" = a choice for dropdown -->
                <option value="hybrid">Hybrid</option>
                <option value="onsite">On-site</option>
            </select>

            <label for="location">Location</label>
            <input type="text" id="location">

            <label for="pay">Pay</label>
            <input type="text" id="pay">

            <label for="status">Status</label>
            <select id="status">
                <option value="applied">Applied</option>
                <option value="interview">Interview</option>
                <option value="offer">Offer</option>
                <option value="rejected">Rejected</option>
                <option value="withdrawn">Withdrawn</option>
            </select>

            <label for="date-applied">Date Applied</label>
            <input type="date" id="date-applied"> <!-- " input type of date allows for built-in date picker box"-->

            <label for="job-url">Job Posting URL</label>
            <input type="url" id="job-url"> <!-- url input type is used for URLs-->

            <label for="notes">Notes</label>
            <textarea id="notes"></textarea> <!-- textarea provides larger text box for multiple lines -->
            
            <button type="submit">Add Application</button> <!-- creates a clickable button-->

        </form>

        <h2>Applications</h2> <!-- heading for section where saved applications are viewed-->

        <div id="applications-list"></div> 
        <!-- "div" is a general purpose container
              In this case, this one is empty. We will use
              JavaScript to find the "applications-list" to
              insert saved jobs in it-->

        <script src="app.js"></script>
            <!--<script> tells browser to run JS.
                src shows what JS file to use.-->

    </body>
</html>
